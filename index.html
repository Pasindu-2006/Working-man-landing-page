<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working man website part 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header section -->
    <header class="header">
        <!-- upper section -->
        <div class="container">
            <p>Working time Mon-Thu 9:00 AM - 5:00 PM</p>
            <div class="box">
                <div class="sub">
                    <img src="src/Icon/Email-2.svg" alt="email">
                    <p>info@gmail.com</p>
                </div>

                <div class="sub">    
                    <img src="src/Icon/Phone-2.svg" alt="phone">
                    <p>+(100)234-5767</p>
                </div>
            </div>

            <div class="social-icons">
                <a href="#"><img src="src/Icon/Social-facebook-1.svg" alt="facebook"></a>
                <a href="#"><img src="src/Icon/Social-Instagram.svg" alt="istagram"></a>
                <a href="#"><img src="src/Icon/Social-twitter.svg" alt="twitter"></a>
                <a href="#"><img src="src/Icon/Social-Whatsapp.svg" alt="whatsApp"></a>
            </div>
        </div>

        <div class="container-wrapper">
            <img src="src/Logo.svg" alt="" class="logo">
            <nav class="navbar">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact Us</a></li>
                </ul>
                <button class="btn-header">Schedule a Call</button>
            </nav>
            <img src="src/Icon/Hamburger-02.svg" alt="" class="menu">
        </div>
    </header>


    <script src="script.js"></script>
</body>
</html>
